cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery
spring.datasource.username=root
spring.datasource.password=Abhijeet@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration — override JWT_SECRET with a strong 32+ char secret in production
jwt.secret=${JWT_SECRET:food-delivery-jwt-secret-key-please-change-in-prod}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

